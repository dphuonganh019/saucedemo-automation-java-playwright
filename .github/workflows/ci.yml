name: CI - Run Automation Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Playwright browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Generate config.properties from Secrets
        run: |
          cat <<EOF > src/test/resources/config.properties
          baseUrl=${{ secrets.BASE_URL }}
          username_standard_user=${{ secrets.USERNAME_STANDARD_USER }}
          username_invalid_user=${{ secrets.USERNAME_INVALID_USER }}
          username_locked_out_user=${{ secrets.USERNAME_LOCKED_OUT_USER }}
          username_problem_user=${{ secrets.USERNAME_PROBLEM_USER }}
          username_performance_glitch_user=${{ secrets.USERNAME_PERFORMANCE_GLITCH_USER }}
          password=${{ secrets.SAUCE_PASSWORD }}
          EOF

      # Known-bug test cases (KnownBugSuite) are left out here so a defect that is already tracked
      # in JIRA does not turn every run red and does not hide new failures
      - name: Run tests (headless)
        run: mvn test -Dheadless=true -Dtest=RegressionSuite,UserJourneySuite

      - name: Set up Python
        if: failure() && github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bug-reporter dependencies
        if: failure() && github.event_name == 'push'
        run: pip install -r scripts/requirements.txt

      - name: File JIRA bug reports for failed tests
        if: failure() && github.event_name == 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_REOPEN_TRANSITION: ${{ vars.JIRA_REOPEN_TRANSITION }}
          REOPEN_WINDOW_DAYS: ${{ vars.REOPEN_WINDOW_DAYS }}
          APP_VERSION: ${{ vars.APP_VERSION }}
        run: python scripts/report_failures.py

      # Runs after the JIRA step on purpose: the bug reporter only sees the main test results,
      # so known bugs never get a new comment on every push. A failure here does not fail the job
      - name: Run known-bug tests (quarantined)
        id: known_bugs
        if: success() || failure()
        continue-on-error: true
        run: mvn test -Dheadless=true -Dtest=KnownBugSuite

      - name: Flag known bugs that now pass
        if: steps.known_bugs.outcome == 'success'
        run: echo "::warning title=Known bug may be fixed::All @Tag(\"known-bug\") test cases passed. Check the linked JIRA bug and remove the tag so they run in RegressionSuite again."

      - name: Upload ExtentReports report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-output/
