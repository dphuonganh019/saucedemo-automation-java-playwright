name: CI - Run Automation Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Playwright browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Generate config.properties from Secrets
        run: |
          cat <<EOF > src/test/resources/config.properties
          baseUrl=${{ secrets.BASE_URL }}
          username_standard_user=${{ secrets.USERNAME_STANDARD_USER }}
          username_invalid_user=${{ secrets.USERNAME_INVALID_USER }}
          username_locked_out_user=${{ secrets.USERNAME_LOCKED_OUT_USER }}
          username_problem_user=${{ secrets.USERNAME_PROBLEM_USER }}
          username_performance_glitch_user=${{ secrets.USERNAME_PERFORMANCE_GLITCH_USER }}
          password=${{ secrets.SAUCE_PASSWORD }}
          EOF

      - name: Run tests (headless)
        run: mvn test -Dheadless=true

      - name: Upload ExtentReports report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-output/
